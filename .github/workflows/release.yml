name: Build & Release

# - Sur une PR : tests + construction de l'installeur Windows et du .dmg macOS (sans publication).
# - Sur main : si la version de src/claude_tracker/__init__.py n'a pas encore
#   de release, publie la release v<version> avec les deux fichiers.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build
        shell: pwsh
        run: .\build.ps1 -Python python

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = (python -c "import claude_tracker; print(claude_tracker.__version__)").Trim()
          "version=$v" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/ClaudeTracker-${{ steps.version.outputs.version }}-Setup.exe
          if-no-files-found: error

  macos:
    runs-on: macos-14  # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: ./build_mac.sh python

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/ClaudeTracker-*-macOS-arm64.dmg
          if-no-files-found: error

  release:
    needs: [windows, macos]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v${{ needs.windows.outputs.version }}"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "La release $tag existe déjà : rien à publier (pense à changer __version__)."
            exit 0
          fi
          ls -la assets
          gh release create "$tag" assets/* \
            --target "$GITHUB_SHA" --title "Claude Usage Tray $tag" --generate-notes
