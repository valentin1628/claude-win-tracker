[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-win-tracker"
dynamic = ["version"]
description = "Suivi de l'utilisation de l'abonnement Claude dans la barre des tâches Windows et la barre de menus macOS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "customtkinter>=5.2",
    "Pillow>=10.1",
    "pystray>=0.19",
    "requests>=2.31",
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.gui-scripts]
claude-tracker = "claude_tracker.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "claude_tracker.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
