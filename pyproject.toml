[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-win-tracker"
version = "0.1.0"
description = "Suivi de l'utilisation de l'abonnement Claude dans la barre des tâches Windows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "customtkinter>=5.2",
    "Pillow>=10.1",
    "pystray>=0.19",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.gui-scripts]
claude-tracker = "claude_tracker.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
